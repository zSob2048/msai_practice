<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title> kmap </title>
        <style> 
            #map {width: 400px;height: 400px;}
            #roadview{width: 400px;height: 400px;}
        </style>
        <script src="jQuery.js"></script>
        <script src="http://dapi.kakao.com/v2/maps/sdk.js?appkey=6e2377538e7c2d476494bdd32b7161a0"></script>
        <script>
            var roadvieww = new kakao.maps.RoadviewClient(); var map; var roadview; var marker;

            function map_move(lat,lng){
                var loc = new kakao.maps.LatLng(lat,lng);
                map.setCenter(loc);
                roadvieww.getNearestPanoId(loc,50,function(panoId){
                    roadview.setPanoId(panoId,loc);
                });
                marker.setPosition(loc);
            }

            $(function(){
                var mapA = document.getElementById('map');
                var roVA = document.getElementById('roadview');

                navigator.geolocation.getCurrentPosition(function(loc){
                    var point = new kakao.maps.LatLng(loc.coords.latitude, loc.coords.longitude);
                    map = new kakao.maps.Map(mapA,{center:point,level:3});
                    roadview = new kakao.maps.Roadview(roVA);
                    marker = new kakao.maps.Marker({
                        map:map, position:point
                    });
                    map_move(loc.coords.latitude,loc.coords.longitude);
                });

                $("#search1").keyup(function(e){
                    var search1_txt = $(this).val();
                    $.ajax({
                        url: "https://dapi.kakao.com/v2/local/search/address.json",
                        data: { "query": search1_txt },
                        beforeSend: function (req) {
                            req.setRequestHeader("Authorization", "KakaoAK 48412524e1d7ccbf166a18a4687b943e");
                        },
                        success: function (search1_result) {
                            map_move(search1_result.documents[0].y, search1_result.documents[0].x);
                        }
                    });
                });

                $("#search2").keyup(function(e){
                    var search2_txt = $(this).val();
                    $.ajax({
                        url: "https://dapi.kakao.com/v2/local/search/keyword.json",
                        data: { "query": search2_txt, "x": map.getCenter().getLng(), "y": map.getCenter().getLat(), "radius": 500 },
                        beforeSend: function (req) {
                            req.setRequestHeader("Authorization", "KakaoAK 48412524e1d7ccbf166a18a4687b943e");
                        },
                        success: function(search2_result){
                            $("#result_table").empty();
                            $.each(search2_result.documents,function(i,l){
                                var br1 = $("<br>");
                                var br2 = $("<br>");
                                var td = $("<td></td>").append(l.place_name,br1,l.road_address_name,br2,l.phone);
                                var tr = $("<tr></tr>").attr("onclick","map_move("+l.y+","+l.x+")").append(td);
                                $("#result_table").append(tr);

                            });
                        }
                    });
                });
            });
        </script>
    </head>
    <body>
        <table>
            <tr>
                <td><div id="map" style="width:500px;height:400px;"></div></td>
                <td><div id="roadview"></div></td>
            </tr>
            <tr>
                <td align="right"><input id="search1"></td>
                <td><input id="search2"></td>
            </tr>
        </table>
    <table id="result_table" border="1"></table>
        
    </body>
</html>
