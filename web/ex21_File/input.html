<!DOCTYPE html>

        <title> File Upload </title>
    </head>
    <body>
        
        <form action="http://195.168.9.156:9999/file.upload" method="post">
            제목: <input name="title"> <p>
            사진: <input name="photo" type="file"> <p>
            <button> 입력 </button>
        </form>

        form : 편함 <br>
        form 안에 있는 button / input type="submit" / input type="image" snfmaus <br>
        form 속에 있는 input <br>
            name을 reqParam변수명으로 <br>
            내용을 reqParam값으로(인코딩 해서) > 사진의 경우? <br>
        action에 있는쪽으로 요청 <br>
        <br>
        reqParam이 주소에 실려가는 GET 방식으로는 파일 표현 불가 <br>
        > POST방식 사용
