<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title> 기본틀 </title>
    <script src="https://cdn.canvasjs.com/canvasjs.min.js"></script>
    <script src="jQuery.js"></script>
    <script>
        $(function () {


            var pm10Ar = []
            var pm25Ar = []
            $.ajax({
                url: "http://openapi.seoul.go.kr:8088/YOUR_SEOUL_API_KEY/xml/RealtimeCityAir/1/25/",
                success: function (airData) {
                    $(airData).find("row").each(function (i, a) {
                        var sn = $(a).find("SAREA_NM").text();
                        var mn = $(a).find("MSRSTN_NM").text();
                        var pm = $(a).find("PM").text();
                        var fpm = $(a).find("FPM").text();
                        var cg = $(a).find("CAI_GRD").text();

                        // 숫자로 들어가야... > 문자>숫자 형변환
                        pm10Ar[i] = { y: pm * 1, label: mn };
                        pm25Ar[i] = { y: fpm * 1, label: mn };
                        // str > int : *1
                        // str > int : +""

                        var td1 = $("<td></td>").text(sn);
                        var td2 = $("<td></td>").text(mn);
                        var td3 = $("<td></td>").text(pm);
                        var td4 = $("<td></td>").text(fpm);
                        var td5 = $("<td></td>").text(cg);
                        var tr = $("<tr></tr>").append(td1,td2,td3,td4,td5);
                        $("table").append(tr);

                    });

                }
            });
            var chart = new CanvasJS.Chart("chartContainer", {
                title: {
                    text: "서울시 실시간 미세먼지"
                },
                data: [
                    {
                        type: "stackedColumn",
                        dataPoints: pm10Ar
                    },
                    {
                        type: "stackedColumn",
                        dataPoints: pm25Ar
                    }
                ]
            });
            chart.render();
        });
    </script>
</head>

<body>
    <div id="chartContainer" style="height: 300px; width: 100%;"></div>
    <table border="1">

    </table>


</body>

</html>
