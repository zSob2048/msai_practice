<!DOCTYPE html> <!-- <!DOCTYPE html 버전명> : 비워둔경우 5버전 -->
<html>
    <head>
        <!-- 위쪽 표시창(페이지 아이콘 이름 ~ www.어쩌고 부분, 제목이랑 설정 등 들어감) -->
        <meta charset="utf-8">
        <title> 페이지 제목 </title>
    </head>
    <body>
        <!-- 사이트 라고생각할때 그부분 전부 >> 여기가 주 -->
        <marquee> 페이지 내용 </marquee> <!-- 사이트에서 오>왼으로 이동함 -->
        <marquee behavior="alternate"> 페이지 내용 </marquee> <!-- 오>왼으로 이동하다가 반사함 -->
        
    </body>
</html>

<!-- 주석 -->
