<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title> 개체 선택 </title>
        <script src="jQuery.js"></script>
        <style> table{height: 100pt;}</style>
        <script>
            $(function(){
                $("button").click(function(){
                    $(this).css("background-color","#C19999");
                    $(this).parent().css("background-color","#A0CB8C");
                    $(this).closest("table").css("border-style","dotted");
                    alert($(this).parent().find("input").val());
                    // this : 함수를 호출한 (= 이벤트가 발생한) 객체
                    // .parent() : 한단계 상위 객체
                    // .closest("선택자") : 상위객체 중 가장 가까운 선택자
                });
                $("td").click(function(){
                    $(this).children().css("color","#6F9F68");
                    $(this).find("input").css("background-color","#F2F2E8");
                    // .children() : 한단계 하위 객체
                    // .find("선택자") : 하위객체 중 가장 가까운 선택자
                });
            });
        </script>
    </head>
    <body>
        <table>
            <tr><td>
                <input> <button> 버튼 </button>
            </td></tr>
            <tr><td>
                <input> <button> 버튼 </button>
            </td></tr>
            <tr><td>
                <input> <button> 버튼 </button>
            </td></tr>
        </table>
<br>
        <table>
            <tr><td>
                <input> <button> 버튼 </button>
            </td></tr>
            <tr><td>
                <input> <button> 버튼 </button>
            </td></tr>
            <tr><td>
                <input> <button> 버튼 </button>
            </td></tr>
        </table>

        
    </body>
</html>
