<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title> 조건/반복문 </title>
        <script>
            var a = 10;
            if (a>5){ // 괄호 꼭 써야댐(안쓰면err)
                alert("5 초과");} else if (a>3){
                alert("3<a<5");} else{alert("3이하");}

            ///////////////////////////////////////
            // switch(변수){case 값: 내용1; 내용2; ... break; default: break;}
            switch(a){ 
                case 5: alert("a는 4"); break; // break를 쓰지 않으면 다음(a는10)도 실행 >> 권한 설정 등...
                case 10: alert("a는 10"); alert("10"); break; 
                default: alert("나머지"); break;}

        </script>
    </head>
    <body>
        자고싶다


        
    </body>
</html>
