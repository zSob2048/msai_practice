<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title> mobile </title>
        <link rel="stylesheet" href="https://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.css" />
        <script src="https://code.jquery.com/jquery-1.9.1.min.js"></script>
        <script src="https://code.jquery.com/mobile/1.3.2/jquery.mobile-1.3.2.min.js"></script>
        <script src="http://195.168.9.202:2048/socket.io/socket.io.js"></script>
        <script>
            $(function(){
                var socket = io.connect("http://195.168.9.202:2048",{
                    path: '/socket.io',
                    transports: ['websocket']  // 이부분 추후 수업 확인 필요 (없으면 안돌아감)
                });

                $("#chatI").keyup(function(e){
                    // $("#testA").text(e.keyCode);
                    if (e.keyCode == 13){
                        var name = $("#nameI").val();
                        var chat = $("#chatI").val();
                        var msg = {"n":name,"m":chat };
                        // $("#testA").text(msg);
                        socket.emit("userChat",msg);
                        $("#chatI").val("");
                    }
                });

                socket.on("srvChat",function(msg){
                    // $("#testA").text(msg.m);
                    var br = $("<br>");
                    var td1 = $("<td></td>").attr("class","td40");
                    var td2 = $("<td></td>").attr("class","td20");
                    var td3 = $("<td></td>").attr("class","td40");
                    if (msg.n == $("#nameI").val()){
                        $(td3).append(msg.n,br,msg.m);
                        $(td3).attr("class","userMsg");
                    } else {
                        $(td1).append(msg.n,br,msg.m);
                        $(td1).attr("class","elseMsg");
                    }
                    var tr = $("<tr></tr>").append(td1,td2,td3);
                    $("table").append(tr);
                    $(window).scrollTop($(document).height());
                })
            });
        </script>
        <style>
            table{width: 100%;}
            .td40{width: 40%;}
            .td20{width: 20%;}
            .userMsg{background-color: #C19999;color: #FFFFFF;font-weight: lighter;}
            .elseMsg{background-color: #707B8E;color: #FFFFFF;font-weight: lighter;}
        </style>
    </head>
    <body>
        <div data-role="page" id="titleP">
            <div data-role="header" data-position="fixed">
                <h1> 채팅 </h1>
            </div>
            <div data-role="content">
                <input id="nameI" placeholder="대화명">
                <a href="#chatP"> 입장 </a>
            </div>
        </div>
        <div data-role="page" id="chatP">
            <div data-role="header" data-position="fixed">
                <a href="#titleP"> 나가기 </a>
                <h1> 채팅 </h1>
            </div>
            <div data-role="content" id="chatlist">
                <!-- <h1 id="testA"> test </h1> -->
                <table> </table>
            </div>
            <div data-role="footer" data-position="fixed">
                <input id="chatI">
            </div>
        </div>
        
    </body>
</html>
