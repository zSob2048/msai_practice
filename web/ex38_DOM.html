<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title> 기본틀 </title>
        <script src="jQuery.js"></script>
        <script>
            $(function(){
                $("button").click(function(){
                    $("table").append(
                        $("<tr></tr>")
                        .append($("<td></td>").text($("#name_in").val()))
                        .append($("<td></td>").text($("#pric_in").val()))
                    );
                    $("input").val("")
                });
            });
        </script>
    </head>
    <body>
        이름 : <input id="name_in"><br>
        가격 : <input id="pric_in"><br>
        <button>등록</button>
        <hr>
        <table border="1">
            <tr>
                <th>이름</th>
                <th>가격</th>
            </tr>

        </table>
        
    </body>
</html>
