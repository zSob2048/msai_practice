<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title> Table </title>
    </head>
    <body>
        <table border="1" width="200" height="200">
            <tr>
                상
                <td align="center"> 좌 </td>
                <td> 중 </td>
                <td align="right"> 우 </td>
            </tr>
            <tr>
                하
                <td valign="top"> 좌 </td>
                <td> 중 </td>
                <td valign="bottom" align="center"> 우 </td>
            </tr>
        </table>    
        <hr>
        <table border="1" width="200" height="200">
            <tr>
                <td> 1 </td> <td colspan="2"> 2 </td>  <td> 4 </td>
            </tr>
            <tr>
                <td colspan="3"> 5 </td>     <td rowspan="3"> 8 </td>
            </tr>
            <tr>
                <td rowspan="2"> 9 </td> <td> 10 </td> <td> 11 </td>
            </tr>
            <tr>
                 <td> 14 </td> <td> 15 </td>
            </tr>
        <table border="1" width="200" height="200">
            <tr>
                <td colspan="2">  </td>  <td rowspan="2">  </td>
            </tr>
            <tr>
                <td rowspan="2">  </td><td>  </td>  
            </tr>
            <tr>
                  <td colspan="2"> </td>
            </tr>

        </table>
    </body>
</html>
